# Media for a project card (all optional, pick one):
#   image: img/projects/odometry.jpg
#   video: img/projects/odometry.mp4               ← short muted looping clip (keep < 10 MB)
#   video: https://youtu.be/VIDEO_ID               ← YouTube (unlisted works)
#   video: https://drive.google.com/file/d/FILE_ID/view   ← Google Drive (sharing: "Anyone with the link")
# With no media the card shows a banner with its icon.
projects:
  - title: Multi-Wheel Odometry with Kalman Filtering
    meta: Robotics · Sensor fusion
    icon: gauge
    description: Real-time odometry estimation for a 4-wheel differential-drive robot, fusing wheel encoder data through a Kalman filter for a stable pose estimate.
    tags: [Python, Kalman Filter, Odometry]
    links:
      - label: Code
        url: https://github.com/NJ-2384/Multi-Wheel-Odometry-with-Kalman-Filtering

  - title: Automatic Industrial Waste Sorting System
    meta: Automation · Hardware
    icon: recycle
    description: A low-cost system that sorts mixed-material waste automatically with minimal human intervention.
    tags: [Sensors, Actuators, Automation]
    links:
      - label: Code
        url: https://github.com/NJ-2384/Automatic-Industrial-Waste-Sorting-System

  - title: Real-Time Fall Detection Band
    meta: Embedded · Wearable
    icon: watch
    description: A smart band that detects falls in elderly people, children and people with disabilities, sends GSM alerts and shares live GNSS location. Patented.
    tags: [C++, IMU, GSM, GNSS]
    links:
      - label: Code
        url: https://github.com/NJ-2384/Real-Time-Sustainable-Fall-Detection-Band

  - title: Oorja — Real-Time Power Monitoring
    meta: IoT · Energy
    icon: zap
    description: Live monitoring and analysis of power consumption, helping homes and industries cut energy use and cost. Published as a research paper.
    tags: [C++, IoT, MQTT]
    links:
      - label: Code
        url: https://github.com/NJ-2384/Oorja

  - title: Early Detection of Groundwater Contamination
    meta: IoT · Environment
    icon: droplets
    description: A sensor-based system that monitors groundwater quality and flags contamination early.
    tags: [C++, Sensors, Embedded]
    links:
      - label: Code
        url: https://github.com/NJ-2384/Early-Detection-of-Contamination-in-Groundwater

  - title: ImageSorter
    meta: Computer vision
    icon: scan-face
    description: Trains a face-encoding model on a dataset, then scans a whole folder tree and separates out photos that match above 60%.
    tags: [Python, Face Recognition, OpenCV]
    links:
      - label: Code
        url: https://github.com/NJ-2384/ImageSorter

  - title: RemuxPlus
    meta: Desktop tool
    icon: clapperboard
    description: A modern GUI over FFmpeg that handles video processing without the command line.
    tags: [Python, CustomTkinter, FFmpeg]
    links:
      - label: Code
        url: https://github.com/NJ-2384/RemuxPlus

