<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <!-- All content lives in data.yml. This file is only the layout. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    :root {
      --bg: #0b0f14;
      --bg-2: #111821;
      --card: #141c26;
      --line: #1f2a37;
      --text: #e6edf3;
      --muted: #8b98a8;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --radius: 14px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* ---------- nav ---------- */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11, 15, 20, .8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { font-family: var(--mono); font-weight: 600; color: var(--accent); }
    nav ul { display: flex; gap: 28px; list-style: none; }
    nav ul a { color: var(--muted); font-size: .95rem; transition: color .2s; }
    nav ul a:hover { color: var(--text); }
    @media (max-width: 700px) { nav ul { display: none; } }

    /* ---------- hero ---------- */
    .hero { padding: 110px 0 90px; position: relative; overflow: hidden; }
    .hero::before {
      content: ""; position: absolute; inset: -40% -20% auto auto; width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(56,189,248,.18), transparent 65%);
      pointer-events: none;
    }
    .hero .wrap { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: center; }
    .tag {
      font-family: var(--mono); font-size: .85rem; color: var(--accent);
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
    }
    .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    h1 { font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1.1; font-weight: 800; letter-spacing: -.02em; }
    h1 .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p.lead { color: var(--muted); font-size: 1.1rem; margin: 20px 0 28px; max-width: 560px; }
    .stats { display: flex; gap: 32px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat b { display: block; font-size: 1.6rem; font-weight: 700; }
    .stat span { color: var(--muted); font-size: .85rem; }
    .btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn {
      padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: .95rem;
      border: 1px solid var(--line); transition: transform .15s, border-color .2s, background .2s;
    }
    .btn:hover { transform: translateY(-2px); border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #04111a; border-color: var(--accent); }
    .portrait {
      aspect-ratio: 1; border-radius: 24px; border: 1px solid var(--line);
      background: linear-gradient(135deg, var(--card), var(--bg-2));
      display: grid; place-items: center; overflow: hidden;
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; }
    .portrait .initials { font-size: 5rem; font-weight: 800; color: var(--line); }
    @media (max-width: 800px) {
      .hero .wrap { grid-template-columns: 1fr; }
      .portrait { max-width: 260px; }
    }

    /* ---------- sections ---------- */
    section { padding: 90px 0; border-top: 1px solid var(--line); }
    .eyebrow { font-family: var(--mono); color: var(--accent); font-size: .85rem; margin-bottom: 8px; }
    h2 { font-size: 2rem; font-weight: 700; margin-bottom: 40px; letter-spacing: -.01em; }

    /* ---------- cards ---------- */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 26px; display: flex; flex-direction: column; gap: 12px;
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(56,189,248,.5); }
    .card.highlight { border-color: rgba(56,189,248,.5); }
    .card .meta { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
    .card h3 { font-size: 1.15rem; font-weight: 600; }
    .card p { color: var(--muted); font-size: .93rem; flex: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: var(--mono); font-size: .75rem; padding: 4px 10px; border-radius: 999px;
      background: rgba(56,189,248,.08); color: var(--accent); border: 1px solid rgba(56,189,248,.2);
    }
    .card .links { display: flex; gap: 16px; font-size: .88rem; font-weight: 600; }
    .card .links a { color: var(--accent); }
    .card .links a:hover { text-decoration: underline; }

    /* ---------- timeline ---------- */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
    .item { position: relative; margin-bottom: 40px; }
    .item::before {
      content: ""; position: absolute; left: -28px; top: 6px; width: 14px; height: 14px; border-radius: 50%;
      background: var(--bg); border: 2px solid var(--accent);
    }
    .item .when { font-family: var(--mono); font-size: .8rem; color: var(--accent); }
    .item h3 { font-size: 1.1rem; margin: 4px 0; }
    .item .org { color: var(--muted); font-size: .95rem; margin-bottom: 10px; }
    .item ul { color: var(--muted); padding-left: 18px; font-size: .93rem; }
    .item li { margin-bottom: 4px; }

    .cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .cols .card h3 { font-size: 1rem; }

    /* ---------- contact ---------- */
    .contact { text-align: center; }
    .contact p { color: var(--muted); max-width: 560px; margin: -24px auto 36px; }
    .contact .btns { justify-content: center; }
    footer { padding: 32px 0; text-align: center; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

    .error { max-width: 640px; margin: 120px auto; padding: 24px; border: 1px solid #7f1d1d; border-radius: 12px; background: #1c0f0f; color: #fca5a5; font-family: var(--mono); font-size: .9rem; white-space: pre-wrap; }

    /* ---------- reveal on scroll ---------- */
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
    .reveal.show { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ---------- helpers ----------
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const list = a => Array.isArray(a) ? a : [];
    const chips = items => list(items).length ? `<div class="chips">${list(items).map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : '';
    const links = items => list(items).length ? `<div class="links">${list(items).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join('')}</div>` : '';
    const section = (id, eyebrow, title, body) => `
      <section id="${id}"><div class="wrap">
        <div class="eyebrow">// ${esc(eyebrow)}</div>
        <h2>${esc(title)}</h2>
        ${body}
      </div></section>`;
    const dates = (from, to) => [from, to].filter(Boolean).map(esc).join(' — ');

    // ---------- renderer ----------
    function render(d) {
      const p = d.profile || {};
      const initials = (p.name || '').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.title = `${p.name || 'Portfolio'}${p.status ? ' — ' + p.status : ''}`;

      const nav = [
        ['projects', 'Projects', d.projects],
        ['research', 'Patents', d.research],
        ['experience', 'Experience', d.experience],
        ['skills', 'Skills', d.skills],
        ['contact', 'Contact', true],
      ].filter(n => n[2] && (n[2] === true || list(n[2]).length));

      const hero = `
        <nav><div class="wrap">
          <a href="#" class="logo">${esc(p.logo || initials)}</a>
          <ul>${nav.map(([id, label]) => `<li><a href="#${id}">${label}</a></li>`).join('')}</ul>
        </div></nav>
        <header class="hero"><div class="wrap">
          <div>
            ${p.status ? `<div class="tag">${esc(p.status)}</div>` : ''}
            <h1>Hi, I'm ${esc(p.short_name || p.name)}.<br><span class="grad">${esc(p.headline)}</span></h1>
            <p class="lead">${esc(p.bio)}</p>
            <div class="stats">${list(d.stats).map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>
            <div class="btns">
              <a class="btn primary" href="#projects">View my work</a>
              ${p.resume ? `<a class="btn" href="${esc(p.resume)}" target="_blank">Résumé</a>` : ''}
              ${p.github ? `<a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}
            </div>
          </div>
          <div class="portrait">${p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}">` : `<span class="initials">${esc(initials)}</span>`}</div>
        </div></header>`;

      const projects = list(d.projects).length ? section('projects', 'projects', "Things I've built", `
        <div class="grid">${list(d.projects).map(x => `
          <article class="card reveal">
            ${x.meta ? `<div class="meta">${esc(x.meta)}</div>` : ''}
            <h3>${esc(x.title)}</h3>
            <p>${esc(x.description)}</p>
            ${chips(x.tags)}${links(x.links)}
          </article>`).join('')}
        </div>`) : '';

      const research = list(d.research).length ? section('research', 'patents & publications', 'Research', `
        <div class="grid">${list(d.research).map(x => `
          <article class="card reveal">
            <div class="meta">${esc(x.type)}</div>
            <h3>${esc(x.title)}</h3>
            <p>${esc(x.description)}</p>
            ${links(x.links)}
          </article>`).join('')}
        </div>`) : '';

      const experience = list(d.experience).length ? section('experience', 'experience', "Where I've worked", `
        <div class="timeline">${list(d.experience).map(x => `
          <div class="item reveal">
            <div class="when">${dates(x.from, x.to)}</div>
            <h3>${esc(x.role)}</h3>
            <div class="org">${[x.org, x.location].filter(Boolean).map(esc).join(' · ')}</div>
            ${list(x.points).length ? `<ul>${list(x.points).map(pt => `<li>${esc(pt)}</li>`).join('')}</ul>` : ''}
          </div>`).join('')}
        </div>`) : '';

      const eduCards = [
        ...list(d.education).map(x => `
          <div class="card reveal">
            <div class="meta">${dates(x.from, x.to)}</div>
            <h3>${esc(x.degree)}</h3>
            <p>${esc(x.school)}${x.note ? `<br>${esc(x.note)}` : ''}</p>
          </div>`),
        list(d.certifications).length ? `<div class="card reveal"><h3>Certifications</h3>${chips(d.certifications)}</div>` : '',
        list(d.awards).length ? `<div class="card reveal"><h3>Honors &amp; Awards</h3>${chips(d.awards)}</div>` : '',
      ].join('');
      const education = eduCards.trim() ? section('education', 'education & awards', 'Education', `<div class="cols">${eduCards}</div>`) : '';

      const skills = list(d.skills).length ? section('skills', 'skills', 'Toolbox', `
        <div class="cols">${list(d.skills).map((g, i) => `
          <div class="card reveal${i === 0 ? ' highlight' : ''}">
            <h3>${esc(g.group)}</h3>${chips(g.items)}
          </div>`).join('')}
        </div>`) : '';

      const contact = `
        <section id="contact" class="contact"><div class="wrap">
          <div class="eyebrow">// contact</div>
          <h2>Let's build something</h2>
          <p>Robotics, automation or embedded work — I'm always happy to talk.</p>
          <div class="btns">
            ${p.email ? `<a class="btn primary" href="mailto:${esc(p.email)}">Email me</a>` : ''}
            ${p.linkedin ? `<a class="btn" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ''}
            ${p.github ? `<a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}
          </div>
        </div></section>
        <footer>© ${new Date().getFullYear()} ${esc(p.name)} · Built with plain HTML, hosted on GitHub Pages</footer>`;

      document.getElementById('app').innerHTML = hero + projects + research + experience + education + skills + contact;

      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('show'); io.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    // ---------- load ----------
    fetch('data.yml', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(`Could not load data.yml (HTTP ${r.status})`); return r.text(); })
      .then(text => render(jsyaml.load(text)))
      .catch(err => {
        const hint = location.protocol === 'file:'
          ? '\n\nYou opened the file directly. Browsers block that.\nRun this in the Website folder instead:\n  python -m http.server\nthen open http://localhost:8000'
          : '';
        document.getElementById('app').innerHTML = `<div class="error">${esc(err.message)}${hint}</div>`;
      });
  </script>
</body>
</html>
